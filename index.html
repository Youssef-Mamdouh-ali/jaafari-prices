<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الجعفري – قائمة الأسعار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#fff;--ink:#0e2230;--mute:#5a6e7a;--line:#d3dde2;--navy:#0e2a3b;--brass:#c8963a;--ok:#0f7d48;--inp:#fff;--br:#1b7a3e;--kessel:#3c4650;--smart:#c9650d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a141b;--sf:#122530;--ink:#e6eef2;--mute:#93a8b3;--line:#233a47;--navy:#07151e;--brass:#dcaa4e;--ok:#4cd08a;--inp:#1b3340;--kessel:#5b6a76;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a141b;--sf:#122530;--ink:#e6eef2;--mute:#93a8b3;--line:#233a47;--navy:#07151e;--brass:#dcaa4e;--ok:#4cd08a;--inp:#1b3340;--kessel:#5b6a76;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;-webkit-text-size-adjust:100%}
html,body{width:100%;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 48px}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.hero{position:relative;background:var(--bg);color:var(--ink);margin:0 -14px;padding:40px 14px 30px;text-align:center}
.hero h1{margin:0;font-size:56px;font-weight:800;line-height:1.15;color:var(--ink)}
.hero p{margin:6px 0 0;color:var(--mute);font-size:17px}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--brass)}
.bar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--line)}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:stretch;background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:96px}
.tile:active{opacity:.85}
.mark{flex:0 0 118px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;text-align:center;padding:6px;direction:ltr}
.tx{flex:1;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.tx b{font-size:19px;font-weight:800}
.tx small{color:var(--mute);font-size:14px}
.tile svg{align-self:center;margin-inline-end:12px;color:var(--mute)}
.note{text-align:center;color:var(--mute);font-size:14px;margin-top:26px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);color:var(--ink);margin:0 -14px;padding:10px 14px 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{width:40px;height:40px;border-radius:50%;background:rgba(127,140,150,.16);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.top h2{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;direction:ltr}
.top h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg)}
input{color:var(--ink);background:var(--inp);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
input:focus-visible,.chip:focus-visible,.back:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
#q{width:100%;box-sizing:border-box;font-size:18px;height:50px}
.disc{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.disc label{font-weight:600;color:var(--ink)}
#d{width:80px;height:40px;text-align:center;font-size:18px;font-weight:800;padding:0 8px}
.chip{border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:20px;padding:4px 14px;font-size:14px;cursor:pointer;min-height:34px}
.cnt{color:var(--mute);font-size:14px;margin:8px 2px 0}
.g{margin-top:14px}
.gh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;border-inline-start:6px solid var(--c)}
.gh img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:#fff}
.gh h3{margin:0;font-size:18px;font-weight:800;line-height:1.3}
.gh small{color:var(--mute)}
.rows{background:var(--sf);border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden}
.r{display:flex;align-items:baseline;gap:8px;padding:10px 14px;min-height:46px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.r.h{min-height:0;padding:6px 14px;font-size:13px;color:var(--mute);background:#f3f6f8}
.r i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-5px)}
.r.h i{border:0}
.s{font-weight:600}
.p{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;min-width:84px;text-align:end}
.has-d .p{font-size:15px;font-weight:600;color:var(--mute);text-decoration:line-through}
.r.h .p{text-decoration:none;font-size:13px}
.d{font-weight:800;font-size:19px;color:var(--ok);min-width:96px;text-align:end;font-variant-numeric:tabular-nums}
.r.h .d{font-size:13px;font-weight:600;color:var(--ok)}
.badge{background:var(--brass);color:#111;border-radius:6px;font-size:12px;padding:0 7px;margin-inline-start:8px;font-weight:800}
.warn{background:#fff3cd;color:#5a4300;padding:9px 14px;text-align:center;font-size:14px;font-weight:600;border-bottom:1px solid #e6cf85}
.empty{text-align:center;color:var(--mute);padding:48px 14px}
:root:root:root{--bg:#fff;--ink:#0e2230;--mute:#5a6e7a;--line:#d3dde2;--inp:#fff;--ok:#0f7d48;--br:#20934d;--kessel:#5b6b78;--smart:#d06a0f;--cd:#1a4057;--ch:#0e2a3b;--cink:#f2f7fa;--cmute:#a9bfcc;--cline:rgba(255,255,255,.13);--cok:#7be3a8;--sf:#fff;--navy:#0e2a3b;--brass:#c8963a;color-scheme:light}
.tile{background:var(--cd);border-color:var(--ch);color:var(--cink)}
.tx small,.tile svg{color:var(--cmute)}
.gh{background:var(--ch);border-color:var(--ch);color:var(--cink)}
.gh small{color:var(--cmute)}
.rows{background:var(--cd);border-color:var(--ch);color:var(--cink)}
.r{border-top-color:var(--cline)}
.r i{border-bottom-color:rgba(255,255,255,.3)}
.r.h{background:var(--ch);color:var(--cmute)}
.p{color:var(--cink)}
.has-d .p{color:var(--cmute)}
.d,.r.h .d{color:var(--cok)}

/* ===== تظبيط الموبايل ===== */
:root{--pad:12px}
.wrap{padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom,0px))}
.hero,.bar{margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad)}
.hero{padding-block:22px 18px}
.hero h1{font-size:40px}
.hero p{font-size:15px;margin-top:2px}
.lead{margin:14px 2px 8px;font-weight:800;font-size:16px}
.tiles{gap:10px}
.tile{min-height:76px;border-radius:12px;-webkit-tap-highlight-color:transparent}
.mark{flex-basis:92px;font-size:17px;padding:4px}
.tx{padding:8px 12px}
.tx b{font-size:17px;line-height:1.35}
.tx small{font-size:13px}
.note{margin-top:16px;font-size:13px}
.bar{padding-block:8px 10px}
.top{gap:8px;margin-bottom:8px}
.back{width:38px;height:38px;flex:none}
.top h2{font-size:19px}
.disc{margin:0;margin-inline-start:auto;gap:6px;flex-wrap:nowrap}
.disc label{font-size:14px;white-space:nowrap}
#d{width:64px;height:38px;font-size:16px}
#q{height:46px;font-size:17px}
.cnt{margin:6px 2px 0;font-size:13px}
.g{margin-top:10px}
.gh{padding:8px 12px;gap:10px;border-radius:10px 10px 0 0}
.gh img{width:42px;height:42px}
.gh h3{font-size:16px}
.rows{border-radius:0 0 10px 10px}
.r{padding:7px 12px;min-height:40px;gap:6px}
.r.h{padding:4px 12px}
.r i{min-width:6px}
.s{min-width:0;overflow-wrap:anywhere;font-size:15px}
.p,.d{flex:none;white-space:nowrap;font-size:17px}
.p{min-width:68px}
.d{min-width:78px}
.has-d .p{font-size:14px}
.empty{padding:28px 14px;line-height:1.8}
@media (max-width:360px){
  .hero h1{font-size:34px}
  .mark{flex-basis:80px}
  .p,.d{font-size:16px}
}
</style>
</head>
<body>
<div id="warn"></div><div class="wrap" id="app"></div>
<script>
const CONFIG={SHEET_CSV_URL:"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ23AHJVgoOQl7549jyPfjxqNtr6MlxbBy5H4xZ3uJTow5XbhfpQXtkafRHcRlkqCAUJQxNE6czLa_n/pub?gid=950783629&single=true&output=csv",SETTINGS_CSV_URL:""};
const SEC={br:{name:"B·R",full:"مواسير ووصلات ومحابس المياه",key:"b·r"},kessel:{name:"KESSEL",full:"مواسير الصرف والصفايات",key:"kessel"},smart:{name:"Smart Home",full:"صرف PVC وغرف تفتيش وخلاطات ولواصق",key:"smart"}};
const AR="٠١٢٣٤٥٦٧٨٩";
const norm=s=>String(s||"").toLowerCase().replace(/[٠-٩]/g,c=>AR.indexOf(c)).replace(/[ًٌٍَُِّْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const mk=(b,cat,grp,size,price,nw,img,model)=>({b,cat,grp,size,price,nw,img,model,kg:norm(grp+" "+model+" "+cat),k:norm(grp+" "+size+" "+model+" "+cat)});

let ROWS=[],UPDATED="",CACHE_TIME="",FAILED=false,ERR="";
const st={q:"",cat:"",d:0};
try{st.d=parseFloat(localStorage.getItem("egic-d"))||0}catch(e){}

function csv(t){const o=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);o.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);o.push(r)}return o}
function parseSheet(t){const rs=csv(t);if(!rs.length)return[];const h=rs[0].map(norm),ix=w=>h.findIndex(x=>x.includes(norm(w)));
const I={b:ix("القسم"),c:ix("التصنيف"),g:ix("المجموعة"),s:ix("المقاس"),p:ix("السعر"),n:ix("جديد"),i:ix("الصورة"),m:ix("موديل"),k:ix("كود")};
if(I.g<0||I.p<0)return[];const out=[];
for(const r of rs.slice(1)){const p=parseFloat(norm(r[I.p]).replace(/[,\s]/g,""));if(!(p>=0)||!r[I.g])continue;
const bn=norm(r[I.b]);const b=bn.includes("kessel")||bn.includes("كيسيل")?"kessel":bn.includes("smart")||bn.includes("سمارت")?"smart":"br";
out.push(mk(b,r[I.c]||"",r[I.g],r[I.s]||"",p,r[I.n]&&r[I.n].trim()?1:0,(r[I.i]||"").trim(),(r[I.m]||"")+" "+(I.k>=0?(r[I.k]||""):"")))}return out}

function setWarn(){const w=document.getElementById("warn");
w.innerHTML=FAILED&&ROWS.length?`<div class="warn">النسخة غير محدثة: تعذر الاتصال بالنت. المعروض آخر أسعار اتحملت${CACHE_TIME?" بتاريخ "+esc(CACHE_TIME):""}، وممكن تكون قديمة.</div>`:""}

function readCache(){try{const c=localStorage.getItem("egic-cache");if(c){const x=parseSheet(c);if(x.length){ROWS=x;CACHE_TIME=localStorage.getItem("egic-time")||"";UPDATED=localStorage.getItem("egic-upd")||"";return true}}}catch(e){}return false}

async function loadSheet(){
  if(readCache())render();
  try{
    const rsp=await Promise.race([fetch(CONFIG.SHEET_CSV_URL,{cache:"no-store"}),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),10000))]);
    if(!rsp.ok)throw new Error("HTTP "+rsp.status);
    const t=await rsp.text(),x=parseSheet(t);
    if(!x.length)throw new Error("الأعمدة مش متعرفة: "+t.slice(0,70).replace(/\s+/g," "));
    ROWS=x;FAILED=false;CACHE_TIME=new Date().toLocaleString("ar-EG");
    try{localStorage.setItem("egic-cache",t);localStorage.setItem("egic-time",CACHE_TIME)}catch(e){}
    if(CONFIG.SETTINGS_CSV_URL){try{const s=await(await fetch(CONFIG.SETTINGS_CSV_URL,{cache:"no-store"})).text();const r=csv(s).find(r=>norm(r[0]).includes("تاريخ"));if(r&&r[1]){UPDATED=r[1];try{localStorage.setItem("egic-upd",UPDATED)}catch(e){}}}catch(e){}}
    else UPDATED="";
  }catch(e){FAILED=true;ERR=String(e&&e.message||e)}
  setWarn();render()
}

function groups(b){const m=new Map();for(const r of ROWS)if(r.b===b){const k=r.cat+"|"+r.grp;if(!m.has(k))m.set(k,{cat:r.cat,name:r.grp,img:r.img,nw:0,kg:r.kg,rows:[]});const g=m.get(k);g.rows.push(r);if(r.nw)g.nw=1;if(!g.img&&r.img)g.img=r.img}return[...m.values()]}

function home(){const ch='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const tiles=Object.entries(SEC).map(([k,s])=>{const n=ROWS.filter(r=>r.b===k).length;return`<a class="tile" href="#${k}" data-go="${k}" style="--c:var(--${k})"><span class="mark">${s.name}</span><span class="tx"><b>${s.full}</b><small>${n} منتج</small></span>${ch}</a>`}).join("");
document.getElementById("app").innerHTML=`<div class="hero"><h1>الجعفري</h1><p>قائمة أسعار إيچيك</p></div><p class="lead">اختار القسم</p><div class="tiles">${tiles}</div><p class="note">${UPDATED?"آخر تحديث للأسعار: "+esc(UPDATED)+"<br>":""}الأسعار شاملة ضريبة القيمة المضافة</p>`}

function section(k){const s=SEC[k];
st.q="";st.cat="";
document.getElementById("app").innerHTML=`<div class="bar" style="--c:var(--${k})"><div class="top"><a class="back" href="#home" data-go="" aria-label="الرئيسية"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a><h2>${s.name}</h2><div class="disc"><label for="d">خصم %</label><input id="d" type="number" inputmode="decimal" min="0" max="100" step="any" value="${st.d||""}" placeholder="0"></div></div>
<input id="q" type="search" placeholder="ابحث… مثال: كوع 25" autocomplete="off">
</div><div id="res"></div>`;
const q=document.getElementById("q"),d=document.getElementById("d");
q.oninput=()=>{st.q=q.value;results(k)};
d.oninput=()=>{setD(parseFloat(d.value)||0);results(k)};
results(k)}
function setD(v){st.d=Math.min(Math.max(v,0),100);try{localStorage.setItem("egic-d",st.d)}catch(e){}}

function results(k){const toks=norm(st.q).split(/\s+/).filter(Boolean),d=st.d;let total=0,html="";
for(const g of groups(k)){if(st.cat&&g.cat!==st.cat)continue;let rows=g.rows;
if(toks.length&&!toks.every(t=>g.kg.includes(t)))rows=rows.filter(r=>toks.every(t=>r.k.includes(t)));
if(!rows.length)continue;total+=rows.length;
const img=g.img?`<img src="${esc(g.img)}" alt="" loading="lazy">`:"";
html+=`<section class="g${d?" has-d":""}" style="--c:var(--${k})"><div class="gh">${img}<div><h3>${esc(g.name)}${g.nw?'<span class="badge">جديد</span>':""}</h3><small>${esc(g.cat)}</small></div></div>${d?`<div class="rows"><div class="r h"><span>المقاس</span><i></i><span class="p">السعر</span><span class="d">بعد خصم ${d}%</span></div>`:'<div class="rows">'}`+
rows.map(r=>`<div class="r"><span class="s">${esc(r.size)}${r.nw?'<span class="badge">جديد</span>':""}</span><i></i><span class="p">${fmt(r.price)}</span>${d?`<span class="d">${fmt(Math.round(r.price*(100-d))/100)}</span>`:""}</div>`).join("")+`</div></section>`}
document.getElementById("res").innerHTML=total?`<div class="cnt">${total} نتيجة</div>`+html:`<div class="empty">مفيش نتائج، جرّب كلمة تانية</div>`}

let route=location.hash.slice(1);function nav(k){route=k;try{location.hash=k||"home"}catch(e){}render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(a){e.preventDefault();nav(a.dataset.go)}});
function render(){const app=document.getElementById("app");
if(!ROWS.length){app.dataset.k="";app.innerHTML=FAILED?`<div class="empty">مفيش أسعار محفوظة على الجهاز.<br>افتح الموقع مرة واحدة وإنت متصل بالنت، وبعدها هيشتغل من غير نت.<br><small style="direction:ltr;display:inline-block;margin-top:6px">${esc(ERR)}</small><br><button class="chip" onclick="location.reload()">حاول تاني</button></div>`:'<p class="empty">جاري تحميل الأسعار…</p>';return}
const k=route,cur=document.getElementById("q");
if(SEC[k]){if(cur&&app.dataset.k===k){results(k);return}app.dataset.k=k;section(k)}else{app.dataset.k="";home()}}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);route=SEC[h]?h:"";render();window.scrollTo(0,0)});

document.getElementById("app").innerHTML='<p class="empty">جاري تحميل الأسعار…</p>';
loadSheet();
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
